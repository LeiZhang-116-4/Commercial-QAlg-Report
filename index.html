<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>量子计算商业化进展报告</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7f5;
      --ink: #17231f;
      --muted: #65736e;
      --line: #d7dfda;
      --accent: #2f675d;
      --accent-soft: #dcebe6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(880px, calc(100vw - 40px));
      padding: 56px 0;
    }
    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 15px;
      letter-spacing: 0;
    }
    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1.08;
      letter-spacing: 0;
      font-weight: 650;
    }
    p {
      margin: 22px 0 0;
      max-width: 680px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.56);
      color: var(--ink);
      font-size: 15px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px var(--accent-soft);
    }
  </style>
</head>
<body>
  <main aria-label="QAlg public report placeholder">
    <p class="eyebrow">Commercial Quantum Algorithm Report</p>
    <h1>量子计算商业化进展报告</h1>
    <p>公开报告页面正在准备中。这里之后会发布由 QAlg 数据库渲染出的静态 HTML 报告，便于通过 GitHub Pages 访问。</p>
    <div class="status"><span class="dot" aria-hidden="true"></span><span>站点占位页已就绪</span></div>
  </main>
</body>
</html>
